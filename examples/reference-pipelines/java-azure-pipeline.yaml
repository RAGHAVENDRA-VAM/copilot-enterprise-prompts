trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  JAVA_VERSION: '17'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository

stages:
  - stage: build
    displayName: 'Build Stage'
    jobs:
      - job: build_app
        displayName: 'Build Application'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: 'Install Java'

          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean install'
              options: '-DskipTests'
            displayName: 'Maven Build'

  - stage: unit_test
    displayName: 'Unit Test Stage'
    dependsOn: build
    jobs:
      - job: run_tests
        displayName: 'Run Unit Tests'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: 'Install Java'

          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'test'
            displayName: 'Run Tests'

  - stage: sast_scan
    displayName: 'Security Scan Stage'
    dependsOn: unit_test
    jobs:
      - job: security_scan
        displayName: 'SAST Security Scan'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: 'Install Java'

          - script: |
              echo "Run SAST tool here (SonarQube, Snyk, etc.)"
            displayName: 'Security Scan'

  - stage: artifact_publish
    displayName: 'Artifact Publish Stage'
    dependsOn: sast_scan
    jobs:
      - job: publish
        displayName: 'Publish Artifacts'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(JAVA_VERSION)
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: 'Install Java'

          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'package'
              options: '-DskipTests'
            displayName: 'Package Application'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'target/*.jar'
              ArtifactName: 'drop'
            displayName: 'Publish JAR Artifacts'
